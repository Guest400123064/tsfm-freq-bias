[project]
name = "bias"
version = "0.1.0"
description = "Controlled experiments on frequency bias in time-series forecasting"
requires-python = ">=3.12"
authors = [{ name = "guest400123064", email = "wangy49@engineering.upenn.edu" }]
dependencies = [
    "torch<2.8.0",
    "x-transformers>=2.28.4",
]

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "ruff>=0.14.3",
    "ty>=0.0.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"
extend-exclude = ["experiments/_archive"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ty.environment]
python-version = "3.12"

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
