[project]
name = "fbias"
version = "0.1.0"
description = "Why TSFMs exhibit frequency bias?"
requires-python = ">=3.12"
authors = [{ name = "guest400123064", email = "wangy49@engineering.upenn.edu" }]
packages = [{ include = "fbias", from = "src" }]
dependencies = [
    "huggingface-hub>=1.27.0",
    "just-config-mixin>=0.1.1",
    "polars[pyarrow]>=1.44.1",
    "rich>=15.0.0",
    "seaborn>=0.13.2",
    "tensorblob>=0.3.0",
    "torch<2.8.0",
    "trackio>=0.34.0",
    "x-transformers>=2.28.4",
]

[project.scripts]
nanotfm = "fbias.cli:main"

[dependency-groups]
dev = [
    "bpython>=0.26",
    "pdoc>=16.0.0",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.0.0",
    "ruff>=0.14.3",
    "matplotlib>=3.10.9",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"
